<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Boldonse&family=Host+Grotesk:ital,wght@0,300..800;1,300..800&family=Kanit:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Kiwi+Maru&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&family=Zilla+Slab:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=app_registration" />
    <title>FormularioEback</title>
</head>
<style type="text/css">
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    header,
    form {
        display: flex;
        justify-content: center;
        position: relative;
        top: 125px;
    }

    header,
    span {
        align-items: center;
        margin: 8px 1px;

    }

    .form-item {
        position: relative;
        margin-bottom: 15px
    }

    .form-item input {
        display: block;
        width: 300px;
        height: 35px;
        border: solid 1px #ccc;
        padding: 0 15px;
        border-radius: 8px;
    }

    .form-item input:focus {
        border-color: #ffc400;
        transition: all 0.5s ease;
        outline: none;
    }

    .form-item label {
        position: absolute;
        cursor: text;
        z-index: 2;
        top: 12px;
        left: 10px;
        font-size: 12px;
        font-weight: bold;
        background: #fff;
        padding: 0 10px;
        color: #999;
        transition: all .3s ease;
    }

    input:focus+label,
    input:valid+label {
        font-size: 11px;
        top: -4px;
    }

    .form-item input:focus+label {
        color: rgb(1, 1, 1);
    }

    form button {
        position: absolute;
        left: 310px;
        top: 1px;
        padding: 8px;
        border: 0 solid;
        background-color: #ffc400;
        border-radius: 8px;
        cursor: pointer;
    }

    form button:hover {
        background-color: #4fd45c;

    }

    .lista li {
        list-style: none;
        cursor: text;
    }

    hr {
        margin: 15px;
    }

    .riscado {
        text-decoration:line-through;
    }
</style>

<body>
    <header>
        <span class="material-symbols-outlined">app_registration</span>
        <h1>Formulario</h1>
    </header>
    <form>
        <div class="form-item">
            <input type="text" id="nome" autocomplete="off" required value="">
            <label for="nome">Nome completo</label>
            <button type="button" id="adicionarNome">Cadastrar</button>
            <div class="lista">
                <ul id="lista-nomes"></ul>
            </div>
        </div>
    </form>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="/main2.js"></script>
</body>

</html>
